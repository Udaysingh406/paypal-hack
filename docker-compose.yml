
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-settlemate}
      POSTGRES_USER: ${POSTGRES_USER:-settlemate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-settlemate}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - settlemate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-settlemate} -d ${POSTGRES_DB:-settlemate}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  settlemate-db:
